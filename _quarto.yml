project:
  type: default
  output-dir: _site
  render:
    - index.qmd
  resources:
    - "app_data/*.csv"
    - "app_data/*.parquet"
    - "app_data/*.geojson"
    - "data/lad_study_period.csv"
    - "data/lsoa_hw_period.csv"
    - "_headers"

format:
  dashboard:
    theme:
      - litera
      - styles.scss
    orientation: columns
    include-in-header:
      - text: |
          <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
          <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
          <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
          <script>
            document.addEventListener("DOMContentLoaded", function () {
              const navContainer = document.querySelector("#quarto-dashboard-header .navbar-container");
              if (navContainer && !document.getElementById("ehm-resources-dropdown")) {
                const wrapper = document.createElement("div");
                wrapper.id = "ehm-resources-dropdown";
                wrapper.className = "navbar-resources-dropdown";
                wrapper.innerHTML = `
                  <button type="button" class="navbar-resources-btn" aria-expanded="false" aria-haspopup="true">
                    <i class="bi bi-box-arrow-up-right"></i>
                    <span>Resources &amp; Code</span>
                    <i class="bi bi-chevron-down" style="font-size: 0.7rem;"></i>
                  </button>
                  <div class="navbar-resources-menu" role="menu">
                    <a href="https://github.com/ehm-lab/UK-HW2026" target="_blank" rel="noopener noreferrer" role="menuitem">
                      <i class="bi bi-github"></i>
                      <div>
                        <div class="res-title">Study Repository</div>
                        <div class="res-sub">ehm-lab/UK-HW2026</div>
                      </div>
                    </a>
                    <a href="https://github.com/ehm-lab/UKHW2026-app" target="_blank" rel="noopener noreferrer" role="menuitem">
                      <i class="bi bi-code-square"></i>
                      <div>
                        <div class="res-title">App Repository</div>
                        <div class="res-sub">ehm-lab/UKHW2026-app</div>
                      </div>
                    </a>
                    <div class="res-divider"></div>
                    <a href="https://ehm-lab.github.io/" target="_blank" rel="noopener noreferrer" role="menuitem">
                      <i class="bi bi-globe2"></i>
                      <div>
                        <div class="res-title">EHM Lab Website</div>
                        <div class="res-sub">ehm-lab.github.io</div>
                      </div>
                    </a>
                    <a href="https://www.lshtm.ac.uk/research/centres-projects-groups/ehm-lab" target="_blank" rel="noopener noreferrer" role="menuitem">
                      <i class="bi bi-bank"></i>
                      <div>
                        <div class="res-title">LSHTM EHM Group</div>
                        <div class="res-sub">lshtm.ac.uk · EHM Lab</div>
                      </div>
                    </a>
                  </div>
                `;
                navContainer.appendChild(wrapper);
                const btn = wrapper.querySelector(".navbar-resources-btn");
                const menu = wrapper.querySelector(".navbar-resources-menu");
                btn.addEventListener("click", function (e) {
                  e.stopPropagation();
                  const isOpen = menu.classList.toggle("show");
                  btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
                });
                document.addEventListener("click", function (e) {
                  if (!wrapper.contains(e.target)) {
                    menu.classList.remove("show");
                    btn.setAttribute("aria-expanded", "false");
                  }
                });
                document.addEventListener("keydown", function (e) {
                  if (e.key === "Escape") {
                    menu.classList.remove("show");
                    btn.setAttribute("aria-expanded", "false");
                  }
                });
              }
            });
          </script>

execute:
  echo: false
